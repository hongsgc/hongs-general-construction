<!doctype html>
<!-- Email signature card for Hong. Render with build.sh (headless Chrome) to PNG. 480x160 CSS px. -->
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="../../assets/css/fonts.css">
<style>
html,body{margin:0;background:#000}
.card{width:480px;height:160px;box-sizing:border-box;background:#000;color:#fff;display:flex;align-items:center;gap:14px;padding:10px 16px 10px 14px;font-family:"Public Sans",Arial,sans-serif}
.logo{width:180px;height:120px;object-fit:contain;flex:none}
.rule{width:3px;align-self:stretch;margin-block:14px;background:#E41E20;flex:none}
.txt{display:grid;gap:3px;min-width:0}
.name{font-family:"Archivo",Arial,sans-serif;font-weight:850;font-stretch:118%;font-size:22px;line-height:1.1;letter-spacing:-.01em}
.role{font-size:12px;font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:#FF8A80;margin-bottom:5px}
.line{font-size:14px;font-weight:600;line-height:1.35;font-variant-numeric:tabular-nums}
.line b{color:#E41E20;font-weight:800;display:inline-block;width:20px}
.reg{font-size:10.5px;color:#B8BCC0;margin-top:5px;letter-spacing:.02em}
</style></head>
<body>
<div class="card">
  <img class="logo" src="../../assets/img/hongs-logo-full-600.webp" alt="">
  <div class="rule"></div>
  <div class="txt">
    <div class="name">Hong Phan</div>
    <div class="role">Owner</div>
    <div class="line"><b>T</b> 206-227-2275</div>
    <div class="line"><b>W</b> hongsgcpl.com</div>
    <div class="line"><b>E</b> hongtphan@gmail.com</div>
    <div class="reg">WA Contractor Reg. HONGSGC825B5 · Plumbing PC HONGSGC791O7</div>
  </div>
</div>
</body></html>
